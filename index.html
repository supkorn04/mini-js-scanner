<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode & QR Scanner</title>
  <!-- Stable v0.21.0 identical to working production repo -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <h2>Scan Barcode & QR Code</h2>
  <button id="toggle-btn">Start Camera</button>
  
  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="card">
    <div><strong>Scanned Data:</strong></div>
    <div class="result-value" id="result-text">Waiting to scan...</div>
    <div class="result-meta">
      Format: <span id="result-format">-</span>
    </div>
    <div class="result-submeta">
      Engine: <span id="engine-type">-</span>
    </div>

    <!-- Live Real-Time Diagnostic HUD -->
    <div id="diagnostic-hud" class="diagnostic-hud">
      <div class="hud-header">
        <span class="hud-title">[SYSTEM HUD]</span>
        <span id="hud-status" class="hud-status status-idle">IDLE</span>
      </div>
      <div>• Resolution: <span id="hud-res" class="hud-val">0 x 0</span></div>
      <div>• FPS / Frames: <span id="hud-frames" class="hud-val">0</span></div>
      <div>• Active Device: <span id="hud-cam" class="hud-val">-</span></div>
      <div>• Engine Mode: <span id="hud-engine" class="hud-val">Ready</span></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
